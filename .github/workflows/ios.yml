name: Build iOS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install @capacitor/ios if missing
        run: |
          if ! grep -q '"@capacitor/ios"' package.json; then
            npm install @capacitor/ios@latest --legacy-peer-deps
          fi

      - name: Build web application
        run: npm run build

      - name: Add iOS platform if not exists
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Setup CocoaPods
        run: |
          pod --version || brew install cocoapods

      - name: Sync web assets to iOS
        run: npx cap sync ios

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Install Pods (if Podfile exists)
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd ../..
          fi

      - name: Build Xcode project (Archive)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          else
            BUILD_TARGET="-project ios/App/App.xcodeproj"
          fi

          xcodebuild \
            $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath $PWD/build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Export IPA (Unsigned Payload)
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -1)
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r SwiftKasir.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftKasir-iOS-Unsigned
          path: build/ipa/SwiftKasir.ipa
          retention-days: 7
